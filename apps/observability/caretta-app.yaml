apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: caretta
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vanshiz/platform-observability.git
    targetRevision: main
    path: charts/caretta/chart

  destination:
    server: https://kubernetes.default.svc
    namespace: caretta

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true